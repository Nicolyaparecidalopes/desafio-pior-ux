<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0066cc;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .erro {
            width: 90%;
            max-width: 900px;
        }

        .numero {
            font-size: 180px;
            font-weight: bold;
            margin: 0;
            line-height: 1;
        }

        h1 {
            font-size: 38px;
            margin: 20px 0;
        }

        p {
            font-size: 22px;
            margin: 12px 0;
        }

        .alerta {
            background: white;
            color: #0066cc;
            padding: 18px;
            margin: 30px auto;
            max-width: 650px;
            font-size: 24px;
            font-weight: bold;
        }

        .botoes {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: 3px solid white;
            cursor: pointer;
            background: white;
            color: #0066cc;
        }

        #cancelar {
            position: relative;
        }

        #entendi {
            background: #003d80;
            color: white;
        }
    </style>
</head>

<body>

    <div class="erro">

        <div class="numero">404</div>

        <h1>ERRO: PÁGINA NÃO ENCONTRADA</h1>

        <p>Ops! Parece que alguma coisa deu muito errado.</p>

        <div class="alerta">
            🚨 VOCÊ CAIU EM UM GOLPE DE PHISHING! 🚨
        </div>

        <p>
            Essa página fazia parte de uma simulação educativa.
        </p>

        <p>
            O objetivo era mostrar como uma experiência suspeita
            pode induzir o usuário a clicar.
        </p>

        <div class="botoes">
            <button id="cancelar">CANCELAR</button>

            <button id="entendi" onclick="alert('Agora você sabe: desconfie de links e mensagens suspeitas!')">
                ENTENDI
            </button>
        </div>

    </div>

    <script>
        const cancelar = document.getElementById("cancelar");

        cancelar.addEventListener("mouseover", function () {

            const largura = window.innerWidth - 180;
            const altura = window.innerHeight - 100;

            const novaEsquerda = Math.random() * largura;
            const novoTopo = Math.random() * altura;

            cancelar.style.position = "fixed";
            cancelar.style.left = novaEsquerda + "px";
            cancelar.style.top = novoTopo + "px";
        });
    </script>

</body>
</html>
